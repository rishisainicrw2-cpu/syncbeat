# Render Blueprint (FREE tier): web service (API + WebSocket + PWA) + free Postgres.
# Free-tier caveats: the service sleeps after ~15 min idle (first request wakes it, ~30-60 s) and has NO persistent disk,
# so uploaded audio is lost on restart/redeploy (accounts, rooms and playlist rows survive in Postgres).
# For persistent uploads use render.paid.yaml (Starter + disk).
services:
  - type: web
    name: syncbeat
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - { key: JWT_SECRET, generateValue: true }
      - { key: NODE_ENV, value: production }
      - { key: DATABASE_URL, fromDatabase: { name: syncbeat-db, property: connectionString } }
      - { key: DATA_DIR, value: /tmp/syncbeat-data }
databases:
  - { name: syncbeat-db, plan: free }
